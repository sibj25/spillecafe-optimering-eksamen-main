<!DOCTYPE html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Rubik:wght@800&display=swap"
      rel="stylesheet"/>
    <title>Spilgalleri</title>
  </head>
  
  <body>
    <header class="page-header" aria-label="Spilgalleri">
      <img
        src="img/spilcafeen-logo.webp"
        alt="Spilcaféen logo"
        class="brand-logo"
      />
      <h1 class="spilgalleri-titel">Spilgalleri</h1>
    </header>

    <section class="filter-bar" aria-label="Filtre til spilgalleri">
      <div class="filter-group search-group">
        <label for="search-input" class="sr-only">Søg efter spil</label>
        <input
          type="search"
          id="search-input"
          name="search"
          placeholder="🔍 Søg efter spil..."
          aria-label="Søg efter spil"
        />
      </div>

      <div class="filter-dropdown">
        <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="filter-panel">
          <span>Filtre</span>
        </button>

        <div id="filter-panel" class="filter-panel" hidden>
          <div class="filter-group">
            <select id="difficulty-select" name="difficulty" aria-label="Sværhedsgrad">
              <option value="all">Sværhedsgrader</option>
              <option value="Let">Let</option>
              <option value="Mellem">Mellem</option>
              <option value="Svær">Svær</option>
            </select>
          </div>

          <div class="filter-group">
            <select id="genre-select" name="genre" aria-label="Genre">
              <option value="all">Genrer</option>
              <option value="Party">Party</option>
              <option value="Mysterie">Mysterie</option>
              <option value="Familie">Børne-/Familie</option>
              <option value="Deck-builder">Deck-builder</option>
              <option value="Quiz">Quiz</option>
              <option value="Terning">Terning</option>
              <option value="Kooperativt">Kooperativt</option>
              <option value="Abstract">Abstract</option>
              <option value="Ordspil">Ordspil</option>
              <option value="Kortspil">Kortspil</option>
              <option value="Strategi">Strategi</option>
              <option value="Fliselægning">Fliselægning</option>
            </select>
          </div>

          <div class="filter-group">
            <select id="playtime-select" name="playtime" aria-label="Spilletid">
              <option value="all">Spilletider</option>
              <option value="15">15+ min</option>
              <option value="20">20+ min</option>
              <option value="30">30+ min</option>
              <option value="35">35+ min</option>
              <option value="40">40+ min</option>
              <option value="45">45+ min</option>
              <option value="60">60+ min</option>
              <option value="75">75+ min</option>
              <option value="120">120+ min</option>
            </select>
          </div>

          <button id="clear-filters" class="clear-filters" type="button">
            Ryd alle filtre
          </button>
        </div>
      </div>
    </section>

    <main class="main-content" id="main-content">
      <section class="game-list-all" aria-live="polite" aria-label="Liste over spil"></section>
    </main>

    <footer>
      <p>© Spilcaféen</p>
    </footer>

    <dialog id="game-dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <button id="close-dialog" type="button" aria-label="Luk spilinformation">✕</button>
        <div id="dialog-content"></div>
      </form>
    </dialog>

    <script src="../js/app.js"></script>
  </body>
</html>
